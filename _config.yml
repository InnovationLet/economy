title: "InnovationLet Economy"
short_title: "Economy"
tagline: "Trade, labor and the forces moving markets."
description: >-
  InnovationLet Economy covers trade, labor, inflation and the macro
  forces moving companies and households. Independent reporting and
  analysis from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/economy"
main_site: "https://innovationlet.github.io"

category_name: "Economy"
category_meta: "Policy · Trade · Labor"
accent: "green"
hero_title: "The economy, traced to its sources."
hero_lead: >-
  Policy, trade and labor, connected to the companies and people they
  actually affect.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
